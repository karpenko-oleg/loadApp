name: Deploy to VPS
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          debug: true
          script: |
            # Переходим в нужную папку (замените на ваш реальный путь, если он другой)
            cd /root/lessons-devops
            
            # Сбрасываем возможные локальные изменения и подтягиваем свежий код
            git fetch origin main
            git reset --hard origin/main
            
            # Перезапускаем контейнеры, если используется Docker Compose
            # docker compose up -d --build